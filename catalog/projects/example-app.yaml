version: 1
id: example-app
title: Example App
registration: native
aliases: [Demo application]
description: Application with local and managed services.
lifecycle: active
kind: product
repository: example/example-app
tags: [demo, web]
workspaces:
  - host: developer-laptop
    path: /workspace/example-app
readinessDefaults:
  profile: personal
  owner: Example product owner
  dataClassification: internal
  costModel: free
stewards:
  - id: example-product-team
    name: Example product team
    kind: team
    source: operator
    observedAt: 2026-08-13T00:00:00Z
    validUntil: 2027-08-13T00:00:00Z
  - id: example-founder
    name: Example founder
    kind: person
    source: operator
    observedAt: 2026-08-13T00:00:00Z
    validUntil: 2027-08-13T00:00:00Z
stewardshipDefaults:
  accountableOwner: example-founder
  operator: example-product-team
  billingOwner: example-founder
  credentialOwner: example-product-team
access:
  - id: repository-access
    kind: repository
    subject: example/example-app
    access: yes
    source: operator
    note: The product team reviewed repository access separately from ownership.
    observedAt: 2026-08-13T00:00:00Z
credentials:
  - id: example-mail-api
    provider: Example Mail
    purpose: Send transactional email
    secretRef:
      kind: environment
      locator: EXAMPLE_MAIL_API_KEY
    consumers: [production-api]
    owner: example-product-team
    payer: example-founder
    source: operator
    lastVerifiedAt: 2026-08-13T00:00:00Z
    rotationDueAt: 2027-02-13T00:00:00Z
services:
  - id: local-console
    name: Local console
    kind: admin
    environment: local
    host: developer-laptop
    runtime: node
    mode: on-demand
    visibility: local
    url: http://127.0.0.1:3000
    links:
      - id: primary
        type: primary
        label: Open local console
        url: http://127.0.0.1:3000
      - id: docs
        type: docs
        label: Local console guide
        url: https://docs.example.test/example-app/local-console
    probe:
      type: http
      url: http://127.0.0.1:3000/health
      successStatuses: [200]
      timeoutMs: 3000
    reported:
      state: stopped
      note: Start this service only when the local console is needed.
    commands:
      start: npm run dev
      logs: npm run logs

  - id: production-api
    name: Production API
    kind: api
    environment: production
    host: managed-cloud
    runtime: managed
    mode: managed
    visibility: authenticated
    url: https://api.example.test
    endpoint:
      fallback: https://managed-cloud.example.test/example-app
    links:
      - id: primary
        type: primary
        label: Open production API
        url: https://api.example.test
      - id: docs
        type: docs
        label: API documentation
        url: https://docs.example.test/example-app/api
      - id: logs
        type: logs
        label: View managed logs
        url: https://logs.example.test/example-app
    reported:
      state: registered
      note: Documentation-only endpoint reserved by example.test.
    readiness:
      profile: customer-facing
      dataClassification: personal
      costModel: metered
      deployment:
        source: catalog
        provider: Example Cloud
        revision: demo-release-42
        deployedAt: 2026-08-13T10:00:00Z
        url: https://deployments.example.test/example-app/demo-release-42
      dependencies:
        - id: primary-database
          kind: data-store
          name: Primary database
          criticality: required
          provider: Example Database
          url: https://console.example.test/example-app/database
          note: Stores customer records for the production API.
        - id: email-api
          kind: external-api
          name: Transactional email API
          criticality: degraded
          provider: Example Mail
          url: https://status.example.test/mail
      evidence:
        - id: ownership-attestation
          check: ownership
          state: declared
          source: operator
          note: The product owner reviewed the production ownership boundary.
          observedAt: 2026-08-13T00:00:00Z
          validUntil: 2026-11-13T00:00:00Z
        - id: monitoring-review
          check: monitoring
          state: declared
          source: operator
          note: The managed provider is declared as the monitoring owner; no live integration is connected.
          observedAt: 2026-08-13T00:00:00Z
        - id: restore-review
          check: restore
          state: unknown
          source: catalog
          note: No reviewed restore exercise is registered for this API.
        - id: cost-boundary
          check: cost
          state: declared
          source: operator
          note: Billing belongs to the managed provider account.
          url: https://billing.example.test/example-app
    stewardship:
      operator: example-product-team
