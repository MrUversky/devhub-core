name: Bug report
description: Report a reproducible DevHub defect using sanitized data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste a real private catalog,
        internal hostnames, personal paths, credentials or secret-bearing URLs.
  - type: input
    id: version
    attributes:
      label: DevHub version
      description: Release tag or commit SHA.
      placeholder: v0.x.y
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - Source checkout
        - systemd
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use the demo catalog or fictional values.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment details
      description: OS, Node/Docker version, browser or MCP client.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private infrastructure metadata and secrets from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
