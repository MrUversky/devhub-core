version: 1
id: change-me
title: Change me
registration: native
aliases: []
description: Explain what the project does and who uses it.
lifecycle: discovery
kind: product
repository: owner/repository
tags: []
readinessDefaults:
  profile: personal
  owner: Change me
  dataClassification: unknown
  costModel: unknown
stewards:
  - id: product-team
    name: Change me
    kind: team
    source: operator
stewardshipDefaults:
  accountableOwner: product-team
  operator: product-team
  billingOwner: product-team
  credentialOwner: product-team
access: []
credentials: []
workspaces:
  - host: developer-laptop
    path: /absolute/path/to/project
services:
  - id: web
    name: Web application
    kind: web
    environment: local
    host: developer-laptop
    runtime: node
    mode: on-demand
    visibility: local
    url: http://127.0.0.1:3000
    links:
      - id: primary
        type: primary
        label: Open web application
        url: http://127.0.0.1:3000
      - id: docs
        type: docs
        label: Developer documentation
        url: https://docs.example.test/project
    probe:
      type: http
      url: http://127.0.0.1:3000/health
      successStatuses: [200]
      timeoutMs: 5000
      # Optional private-host publisher recipe. The HTTPS probe URL must use
      # the same path and the target must be a minimal 127.0.0.1 health route.
      # publish:
      #   type: tailscale-serve
      #   visibility: tailnet
      #   targetUrl: http://127.0.0.1:3000/api/health
      #   path: /health/change-me
    readiness:
      deployment:
        source: catalog
        provider: Change me
      dependencies: []
      evidence:
        - id: ownership-attestation
          check: ownership
          state: unknown
          source: operator
          note: Replace with a reviewed ownership attestation and add observedAt and validUntil.
        - id: monitoring-status
          check: monitoring
          state: unknown
          source: catalog
          note: No reviewed monitoring evidence has been registered yet.
        - id: recovery-status
          check: restore
          state: unknown
          source: catalog
          note: No reviewed restore test has been registered yet.
    commands:
      start: npm run dev
      logs: npm run logs
